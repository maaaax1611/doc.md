<!-- title: Travelling wave
     lib: fig
     height: 470 -->
<figure class="fig">
  <canvas id="dw-cv" style="aspect-ratio: 2.6 / 1" role="img" aria-label="A sine wave travelling to the right; frequency and amplitude follow the sliders."></canvas>
  <div class="ctrls">
    <div class="ctrl"><div class="lab"><label for="dw-f">Frequency f</label><output id="dw-f-o"></output></div><input id="dw-f" type="range" min="0.5" max="4" step="0.1" value="1.5" autocomplete="off"></div>
    <div class="ctrl"><div class="lab"><label for="dw-a">Amplitude A</label><output id="dw-a-o"></output></div><input id="dw-a" type="range" min="0.1" max="1" step="0.05" value="0.7" autocomplete="off"></div>
    <button class="btn" type="button" id="dw-play">Pause</button>
  </div>
  <figcaption><b>Fig.</b> The wave \(y = A \sin(2\pi f\,(x - t))\). The dot marks one fixed position: it only moves up and down while the pattern travels past it.</figcaption>
</figure>
<script>
(() => {
  const cv = document.getElementById('dw-cv'), inF = document.getElementById('dw-f'), inA = document.getElementById('dw-a');
  const outF = document.getElementById('dw-f-o'), outA = document.getElementById('dw-a-o'), btn = document.getElementById('dw-play');
  let t = 0;

  function draw() {
    const { ctx, w, h } = Fig.fit(cv);
    const f = +inF.value, a = +inA.value, mid = h / 2, amp = (h / 2 - 14) * a;
    outF.textContent = f.toFixed(1); outA.textContent = a.toFixed(2);
    const y = x => mid - amp * Math.sin(2 * Math.PI * f * (x / w - t));

    ctx.strokeStyle = Fig.token('--grid'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke();

    ctx.strokeStyle = Fig.token('--accent'); ctx.lineWidth = 2; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let x = 0; x <= w; x += 2) x === 0 ? ctx.moveTo(x, y(x)) : ctx.lineTo(x, y(x));
    ctx.stroke();

    const px = w * 0.25;
    ctx.strokeStyle = Fig.token('--rule'); ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(px, 8); ctx.lineTo(px, h - 8); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = Fig.token('--fg');
    ctx.beginPath(); ctx.arc(px, y(px), 5, 0, 2 * Math.PI); ctx.fill();
  }

  const redraw = Fig.onRedraw(cv, draw);
  const anim = Fig.loop(cv, dt => { t += dt * 0.25; draw(); });
  const label = () => { btn.textContent = anim.running ? 'Pause' : 'Play'; };
  btn.addEventListener('click', () => { anim.toggle(); label(); });
  [inF, inA].forEach(el => el.addEventListener('input', redraw));
  label();
})();
</script>
