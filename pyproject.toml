[project]
name = "docmd"
version = "0.1.0"
description = "Static docs from Markdown with live, embeddable figures."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markdown>=3.5",
    "pymdown-extensions>=10",
    "pyyaml>=6",
    "beautifulsoup4>=4.12",
]

[project.scripts]
docmd = "docmd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docmd"]

[dependency-groups]
dev = ["pytest>=8"]
